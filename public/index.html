<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Beautifier</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/jsondiffpatch/public/formatters.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsondiffpatch/dist/jsondiffpatch.umd.js"></script>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/jsondiffpatch/public/formatters-styles/html.css">

  <style>
    textarea {
      font-family: Consolas, monospace;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb {
      background: #6366f1;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4f46e5;
    }

    .hljs {
      background: transparent !important;
      padding: 0 !important;
    }

    .hljs,
    .hljs span {
      background: transparent !important;
    }
  </style>

</head>

<body class="min-h-screen bg-[#F8FAFC]">

  <!-- ================= NAVBAR ================= -->
  <nav
    class="sticky top-0 z-50 min-h-16 bg-slate-50/95 backdrop-blur border-b border-slate-200 px-4 sm:px-6 lg:px-10 py-3">

    <div class="flex flex-col sm:flex-row items-center justify-between gap-3">

      <!-- Logo -->
      <div class="flex items-center gap-3 w-full sm:w-auto">

        <div
          class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
          ⚡
        </div>

        <div class="min-w-0">
          <h1 class="text-lg sm:text-2xl font-bold text-slate-900 truncate">
            JSON Formatter
          </h1>

          <p class="text-xs sm:text-sm text-slate-500">
            Fast • Secure • Free
          </p>
        </div>

      </div>

      <!-- Tabs -->
      <div class="flex gap-2 w-full sm:w-auto justify-center">

        <button
          id="formatterTab"
          onclick="showFormatter()"
          class="flex-1 sm:flex-none px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium">
          Formatter
        </button>

        <button
          id="compareTab"
          onclick="showCompare()"
          class="flex-1 sm:flex-none px-4 py-2 rounded-lg bg-slate-200 text-slate-700 text-sm font-medium">
          Compare
        </button>

      </div>

      <!-- Desktop text -->
      <span class="hidden lg:block text-sm text-slate-500">
        Fast & Simple
      </span>

    </div>

  </nav>




  <!-- ================= FORMATTER PAGE ================= -->
  <main
    id="formatterPage"
    class="max-w-[1800px] mx-auto p-3 sm:p-4 md:p-8">

    <div
      class="flex flex-col lg:flex-row gap-5 lg:gap-8 items-stretch min-h-[calc(100vh-150px)] lg:h-[calc(100vh-120px)]">

      <!-- ================= INPUT ================= -->
      <div
        class="flex-1 min-w-0 bg-slate-50 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col min-h-[400px] lg:h-full">

        <div class="px-4 sm:px-6 py-4 border-b border-slate-200 bg-slate-50 shrink-0">

          <h2 class="font-semibold text-slate-900">
            Input JSON
          </h2>

        </div>

        <textarea
          id="input"
          class="flex-1 w-full resize-none overflow-auto outline-none border-0 p-4 sm:p-5 font-mono text-sm bg-slate-50"
          oninput="showFormatButton()"
          placeholder="Enter JSON here"></textarea>

      </div>


      <!-- ================= ACTION BUTTONS ================= -->
      <div
        class="flex justify-center items-center lg:sticky lg:top-1/2 lg:-translate-y-1/2 self-center w-full lg:w-auto">

        <div
          class="flex flex-row flex-wrap lg:flex-col justify-center gap-2 sm:gap-3 bg-white border border-slate-200 rounded-2xl shadow-lg p-2 sm:p-3 w-full sm:w-auto">

          <!-- Format -->
          <button
            id="formatBtn"
            onclick="formatJSON()"
            class="flex-1 sm:flex-none w-auto sm:w-32 lg:w-20 lg:h-20 min-h-14 lg:min-h-0 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-105">

            <span class="text-lg sm:text-xl">✨</span>
            <span class="text-xs font-medium">Format</span>

          </button>


          <!-- Minify -->
          <button
            id="minifyBtn"
            onclick="minifyJSON()"
            class="hidden flex-1 sm:flex-none w-auto sm:w-32 lg:w-20 lg:h-20 min-h-14 lg:min-h-0 bg-orange-500 hover:bg-orange-600 text-white rounded-xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-105">

            <span class="text-lg sm:text-xl">📦</span>
            <span class="text-xs font-medium">Minify</span>

          </button>


          <!-- Clear -->
          <button
            onclick="clearJSON()"
            class="flex-1 sm:flex-none w-auto sm:w-32 lg:w-20 lg:h-20 min-h-14 lg:min-h-0 bg-slate-600 hover:bg-slate-700 text-white rounded-xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-105">

            <span class="text-lg sm:text-xl">🗑️</span>
            <span class="text-xs font-medium">Clear</span>

          </button>


          <!-- Copy -->
          <button
            onclick="copyOutput()"
            class="flex-1 sm:flex-none w-auto sm:w-32 lg:w-20 lg:h-20 min-h-14 lg:min-h-0 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-105">

            <span class="text-lg sm:text-xl">📋</span>
            <span class="text-xs font-medium">Copy</span>

          </button>


          <!-- Sort -->
          <button
            id="sortBtn"
            onclick="sortJSON()"
            class="flex-1 sm:flex-none w-auto sm:w-32 lg:w-20 lg:h-20 min-h-14 lg:min-h-0 bg-amber-500 hover:bg-amber-600 text-white rounded-xl flex flex-col items-center justify-center transition-all duration-300 hover:scale-105">

            <span class="text-lg sm:text-xl">🔤</span>
            <span class="text-xs font-medium">Sort</span>

          </button>

        </div>

      </div>


      <!-- ================= OUTPUT ================= -->
      <div
        class="flex-1 min-w-0 bg-slate-50 rounded-2xl border border-slate-200 shadow-lg hover:shadow-xl transition-all duration-300 overflow-hidden flex flex-col min-h-[400px] lg:h-full">

        <div
          class="px-4 sm:px-6 py-4 border-b border-slate-200 bg-slate-50 shrink-0">

          <h2 class="font-semibold text-slate-900">
            Formatted Output
          </h2>

        </div>

        <div class="flex-1 overflow-hidden min-h-0">

          <pre
            class="h-full overflow-y-auto overflow-x-hidden p-4 sm:p-5 m-0 bg-transparent"><code
              id="output"
              class="language-json text-sm block whitespace-pre-wrap break-words"></code></pre>

        </div>

      </div>

    </div>

  </main>


  <!-- ================= COMPARE PAGE ================= -->
  <main
    id="comparePage"
    class="hidden max-w-[1800px] mx-auto p-3 sm:p-4 md:p-8">

    <div
      class="grid grid-cols-1 lg:grid-cols-2 gap-5 lg:gap-6 min-h-[500px] lg:h-[calc(100vh-220px)]">

      <!-- Left JSON -->
      <div
        class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col min-h-[350px]">

        <div
          class="px-4 sm:px-6 py-4 border-b text-sm sm:text-base font-semibold shrink-0">
          Left JSON
        </div>

        <textarea
          id="leftJson"
          class="flex-1 w-full p-4 sm:p-5 outline-none resize-none font-mono text-sm"></textarea>

      </div>


      <!-- Right JSON -->
      <div
        class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col min-h-[350px]">

        <div
          class="px-4 sm:px-6 py-4 border-b text-sm sm:text-base font-semibold shrink-0">
          Right JSON
        </div>

        <textarea
          id="rightJson"
          class="flex-1 w-full p-4 sm:p-5 outline-none resize-none font-mono text-sm"></textarea>

      </div>

    </div>


    <!-- Compare Button -->
    <div class="flex justify-center mt-5 sm:mt-6">

      <button
        onclick="compareJSON()"
        class="w-full sm:w-auto px-8 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition">
        Compare JSON
      </button>

    </div>


    <!-- Compare Result -->
    <div
      id="compareResult"
      class="mt-5 sm:mt-6 rounded-xl border bg-white p-4 sm:p-6 font-mono text-xs sm:text-sm overflow-auto max-h-[500px]">

    </div>

  </main>


  <!-- ================= SCRIPTS ================= -->
  <script src="./js/script.js"></script>
  <script src="./js/compare.js"></script>

</body>

</html>
